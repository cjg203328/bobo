services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bobo_canvas
      POSTGRES_USER: bobo_canvas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.cloud}
    volumes:
      - cloud-database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bobo_canvas -d bobo_canvas"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    image: bobo-ai-canvas-backend:cloud
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    environment:
      CANVAS_BACKEND_ADDR: ":2010"
      CANVAS_BACKEND_DATA_DIR: /data
      CANVAS_BACKEND_PROFILE: cloud
      CANVAS_DATABASE_DRIVER: postgres
      DATABASE_URL: postgres://bobo_canvas:${POSTGRES_PASSWORD}@database:5432/bobo_canvas?sslmode=disable
      CANVAS_AUTH_COOKIE_SECURE: ${CANVAS_AUTH_COOKIE_SECURE:-false}
      CANVAS_CORS_ORIGINS: ${CANVAS_CORS_ORIGINS:-http://localhost:1010}
      CANVAS_AUTO_MIGRATE: ${CANVAS_AUTO_MIGRATE:-true}
      CANVAS_SHUTDOWN_TIMEOUT: ${CANVAS_SHUTDOWN_TIMEOUT:-10m}
      GIN_MODE: release
    volumes:
      - cloud-backend-data:/data
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2010/api/health/ready >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3
    restart: unless-stopped

  web:
    image: bobo-ai-canvas-web:cloud
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_CANVAS_LOCAL_MODE: "false"
    ports:
      - "${CANVAS_WEB_HOST_PORT:-1010}:1010"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  cloud-database:
  cloud-backend-data:
